<!DOCTYPE html>
<head>
    <title>Cart Quantity Project</title>
</head>
<body>
    <button onclick="cartQuantity += 1;">Add to Cart</button>
    <button onclick="cartQuantity += 2;">+2</button>
    <button onclick="console.log(cartQuantity);">Show Quantity</button>
    <button onclick="cartQuantity += 4;">+4</button>
    <button onclick="cartQuantity += 5;">+5</button>
    <button onclick="cartQuantity -= 1;">Remove from cart</button>
    <button onclick="cartQuantity -= 2;">-2</button>
    <button onclick="cartQuantity -= 3;">-3</button>
    <button onclick="cartQuantity--;">Remove from cart</button>
    <button onclick="console.log(`Cart quantity: ${cartQuantity}`);">Show Quantity</button>
    <script>
        let cartQuantity = 0;
    </script>
</body>
</html>
