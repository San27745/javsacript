<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
      console.log(`Cart quantity: ${cartQua}`);
    ">Show Quantity</button>

    <button onclick="
      if (cartQua + 1 > 10) {
        alert('The cart is full');
      } else {
        cartQua++;
        console.log(`Cart quantity: ${cartQua}`);
      }
    ">Add to Cart</button>

    <button onclick="
      if (cartQua + 2 > 10) {
        alert('The cart is full');
      } else {
        cartQua += 2;
        console.log(`Cart quantity: ${cartQua}`);
      }
    ">+2</button>

    <button onclick="
      if (cartQua + 3 > 10) {
        alert('The cart is full');
      } else {
        cartQua = cartQua + 3;
        console.log(`Cart quantity: ${cartQua}`);
      }
    ">+3</button>

    <button onclick="
      if (cartQua + 4 > 10) {
        alert('The cart is full');
      } else {
        cartQua += 4;
        console.log(`Cart quantity: ${cartQua}`);
      }
    ">+4</button>

    <button onclick="
      if (cartQua + 5 > 10) {
        alert('The cart is full');
      } else {
        cartQua += 5;
        console.log(`Cart quantity: ${cartQua}`);
      }
    ">+5</button>

    <button onclick="
      cartQua--;
      console.log(`Cart quantity: ${cartQua}`);
      ">Remove from cart</button>

    <button onclick="
      cartQua -= 2;
      console.log(`Cart quantity: ${cartQua}`);
    ">-2</button>

    <button onclick="
      cartQua -= 3;
      console.log(`Cart quantity: ${cartQua}`);
    ">-3</button>

    <button onclick="
      cartQua = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQua}`);
    ">Reset Cart</button>

    <script>
      let cartQua = 0;
    </script>
  </body>
</html>
